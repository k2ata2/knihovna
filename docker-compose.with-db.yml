# Šablona pro appku S vlastní PostgreSQL databází — jen pokud ji appka opravdu potřebuje.
# Přejmenuj na docker-compose.yml.
# Nahraď: OWNER/REPO, HOSTNAME, PORT.
# HOSTNAME = foo.vitakriz.cz, ekotex.eu, nebo víc hostnamů: "http://ekotex.eu, http://www.ekotex.eu"
# POSTGRES_* proměnné patří do .env na VPS (/opt/apps/<APPNAME>/.env), nikdy ne do gitu.

services:
  app:
    image: ghcr.io/OWNER/REPO:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - internal-db
      - proxy
    labels:
      caddy: http://HOSTNAME
      caddy.reverse_proxy: "{{upstreams PORT}}"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal-db

volumes:
  postgres-data:

networks:
  internal-db:
    internal: true
  proxy:
    external: true
