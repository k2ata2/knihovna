# Šablona pro STATICKÝ WEB (HTML/CSS/JS, výstup Vite/Astro/Hugo…) — bez DB, bez .env.
# Přejmenuj na docker-compose.yml. Nahraď: OWNER/REPO, HOSTNAME.
# HOSTNAME = foo.vitakriz.cz, ekotex.eu, nebo víc hostnamů: "http://ekotex.eu, http://www.ekotex.eu"
# Image vzniká z Dockerfile.static.example (nginx, port 80).

services:
  app:
    image: ghcr.io/OWNER/REPO:latest
    restart: unless-stopped
    networks:
      - proxy
    labels:
      caddy: http://HOSTNAME
      caddy.reverse_proxy: "{{upstreams 80}}"

networks:
  proxy:
    external: true
