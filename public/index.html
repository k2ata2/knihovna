<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knihovna — Ahoj čtenáři!</title>
  <meta name="description" content="Vítejte v online knihovně. Vytvořená stránka pro knihovna.k2ata.cz.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-glow: rgba(99, 102, 241, 0.15);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-violet: #818cf8;
      --accent-indigo: #6366f1;
      --accent-cyan: #38bdf8;
      --accent-rose: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Dynamic background ambient lights */
    .bg-light {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.45;
      pointer-events: none;
      animation: float 14s ease-in-out infinite alternate;
    }

    .bg-light-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, var(--accent-indigo), transparent 70%);
      top: -100px;
      left: -100px;
    }

    .bg-light-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #4f46e5, transparent 70%);
      bottom: -120px;
      right: -100px;
      animation-delay: -7s;
    }

    .bg-light-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--accent-cyan), transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.2;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(40px, 50px) scale(1.1);
      }
    }

    /* Container */
    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 640px;
      padding: 2.5rem;
      border-radius: 28px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.5),
        0 0 40px -10px var(--card-glow);
      text-align: center;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .container:hover {
      transform: translateY(-4px);
      box-shadow: 
        0 40px 70px -12px rgba(0, 0, 0, 0.6),
        0 0 50px -5px rgba(99, 102, 241, 0.25);
    }

    /* Book Icon Header */
    .icon-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 76px;
      height: 76px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(129, 140, 248, 0.05));
      border: 1px solid rgba(129, 140, 248, 0.3);
      margin-bottom: 1.75rem;
      color: var(--accent-violet);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2);
    }

    .icon-wrapper svg {
      width: 38px;
      height: 38px;
      stroke-width: 1.8;
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(129, 140, 248, 0.25);
      color: var(--accent-violet);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 1.25rem;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #34d399;
      box-shadow: 0 0 10px #34d399;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* Heading */
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-violet) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    /* Paragraph */
    p.description {
      font-size: 1.1rem;
      color: var(--text-secondary);
      line-height: 1.6;
      font-weight: 400;
      margin-bottom: 2rem;
    }

    /* Footer info inside container */
    .domain-tag {
      display: inline-block;
      font-family: 'Outfit', monospace;
      font-size: 0.9rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .domain-tag span {
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <div class="bg-light bg-light-1"></div>
  <div class="bg-light bg-light-2"></div>
  <div class="bg-light bg-light-3"></div>

  <main class="container">
    <div class="icon-wrapper">
      <!-- Book Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18c-2.305 0-4.408.867-6 2.292m0-14.25v14.25" />
      </svg>
    </div>

    <div class="badge">
      <span class="badge-dot"></span>
      Online Knihovna
    </div>

    <h1>Ahoj čtenáři!</h1>

    <p class="description">
      Vítejte v digitální knihovně. Tato nová stránka byla úspěšně vytvořena a je připravena pro vaše další nápady a rozvoj.
    </p>

    <div class="domain-tag">
      Doména: <span>knihovna.k2ata.cz</span>
    </div>
  </main>

</body>
</html>
