name: Deploy

on:
  push:
    branches: [main]   # uprav na "master", pokud repo používá master
  workflow_dispatch:           # ruční spuštění (např. po vytvoření .env na VPS)

env:
  APP_NAME: knihovna          # název adresáře v /opt/apps/ na VPS, jen [a-z0-9-]
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync docker-compose.yml to VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -av --mkpath \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            docker-compose.yml \
            deploy@${{ secrets.VPS_HOST }}:${{ env.APP_NAME }}/docker-compose.yml

      - name: Trigger deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            deploy@${{ secrets.VPS_HOST }} "deploy ${{ env.APP_NAME }}"
